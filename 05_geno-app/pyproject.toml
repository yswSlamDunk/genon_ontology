[project]
name = "geno-app"
version = "0.1.0"
description = "GenO — 데이터 없이 시작해서 직접 올린 데이터로 온톨로지를 만들고 묻는 로컬 시스템"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
