<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenTology</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="ds/core.css">
<link rel="stylesheet" href="ds/semantic.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="geno.css">
</head>
<body>
<div class="shell">
  <aside class="lnb">
    <div class="top"><a class="logo" href="#workspace" aria-label="GenTology 작업 영역"><span class="blogo" role="img" aria-label="GenTology"></span><span class="lk bfall">GenTology</span></a></div>
    <a class="ws" href="#workspace" aria-label="작업 영역 열기"><span class="dot">G</span><span>GenTology 작업 영역</span></a>
    <nav id="nav"></nav>
    <div class="foot" id="llm">LLM 확인 중</div>
  </aside>
  <div class="main">
    <div class="appbar">
      <div class="crumb" id="crumb"></div>
      <span class="sp"></span>
      <span id="ver"></span>
      <div class="whow"><div id="who"></div><div class="menu" id="whoMenu"></div></div>
      <button class="btn out sm" id="copToggle"></button>
    </div>
    <div class="content"><div class="page" id="page"></div></div>
  </div>
  <aside class="cop" id="cop">
    <div class="hd"><span class="av" id="copAv"></span><b>Copilot</b><span class="sp"></span><button class="ibtn" id="copClose" aria-label="Copilot 닫기"></button></div>
    <div class="ctx">현재 화면 <span class="b info" id="ctx"></span></div>
    <div class="msgs" id="msgs"></div>
    <div class="sug" id="sug"></div>
    <div class="cin"><textarea id="cinput" placeholder="예) 주문과 고객을 이어 줘"></textarea><button class="snd" id="csend" aria-label="보내기"></button></div>
  </aside>
</div>
<div class="fab" id="fab"><div class="fabbox" id="fabBox" role="dialog" aria-label="데이터 에이전트"></div><button class="fabb" id="fabBtn" aria-label="데이터 에이전트 열기"></button></div>
<div class="dim" id="dim"></div>
<div class="spanel" id="spanel"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
